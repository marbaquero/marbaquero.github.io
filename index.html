<style>
/* Layout: asymmetric hero (thesis left, live "report" panel right), then app rows alternating example UI, steps, FAQ, closing band. */
:root{
  --bg:#EDF1F3;
  --surface:#F8FAFB;
  --ink:#13232B;
  --muted:#52646D;
  --line:#CBD6DB;
  --accent:#0A6F6A;
  --accent-ink:#FFFFFF;
  --signal:#B7791F;
  --good:#1F7A4D;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A1F;--surface:#13252B;--ink:#E6EEF1;--muted:#93A8B0;--line:#26404A;--accent:#4FC3B8;--accent-ink:#06211F;--signal:#E3B24F;--good:#5CCB92;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1F;--surface:#13252B;--ink:#E6EEF1;--muted:#93A8B0;--line:#26404A;--accent:#4FC3B8;--accent-ink:#06211F;--signal:#E3B24F;--good:#5CCB92;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:750;letter-spacing:-.03em}
h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:700}
h3{font-size:1.15rem;font-weight:650;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;text-decoration:none}
.brand i{font-style:normal;color:var(--accent)}
.langs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langs button{font:500 .8rem var(--f-mono);letter-spacing:.06em;background:none;color:var(--muted);border:0;padding:8px 14px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:start;padding-block:36px 56px}
.hero .lede{font-size:.95rem;color:var(--muted);max-width:42ch;margin-top:18px;line-height:1.5}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-block;font:600 1rem var(--f-body);text-decoration:none;padding:14px 24px;border-radius:6px;border:2px solid var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clocks{display:flex;gap:28px;margin-top:40px;flex-wrap:wrap}
.clock b{display:block;font:500 1.2rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.02em}

/* panel: example report feed */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.feed{list-style:none;margin:0;padding:6px 18px 10px}
.feed li{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.feed li:last-child{border-bottom:0}
.feed time{font:500 .85rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.feed strong{display:block;font-weight:600}
.feed span.who{font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.feed .flag{color:var(--signal)}
.panel-foot{padding:12px 18px;border-top:1px solid var(--line)}

/* shift strip */
.shifts{padding-block:8px 80px}
.strip{display:grid;grid-template-columns:12fr 12fr;margin-top:28px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.strip div{padding:18px;min-width:0}
.strip .day{background:var(--accent);color:var(--accent-ink)}
.strip .night{background:var(--ink);color:var(--bg)}
.strip b{font:500 .8rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px}
.shifts p.note{max-width:62ch;margin-top:20px;color:var(--muted)}

/* app rows */
.apps{padding-block:24px 40px}
.apps>h2{max-width:20ch}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:56px;border-top:1px solid var(--line)}
.app:nth-of-type(even) .copy{order:2}
.apps .app:first-of-type{margin-top:40px}
.app .copy p{color:var(--muted);margin-top:14px;max-width:44ch}
.app .copy .mono{display:block;margin-bottom:12px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tags span{font:500 .78rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:4px 10px;color:var(--muted)}
.ui{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.ui .cap{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.row:last-child{border-bottom:0}
.bar{grid-column:1/-1;height:8px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.low{background:var(--signal)}
.num{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font:500 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.pill.ok{color:var(--good)}.pill.wait{color:var(--signal)}
.total{display:flex;justify-content:space-between;gap:12px;padding-top:14px;margin-top:6px;border-top:2px solid var(--ink);font-weight:600}

/* demos */
.demos{padding-block:56px;border-top:1px solid var(--line)}
.demos .sub{color:var(--muted);margin-top:14px;max-width:56ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:32px}
.tabs button{font:500 .85rem var(--f-mono);letter-spacing:.04em;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.demo{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;margin-top:32px;align-items:start}
.demo .demo-copy p{color:var(--muted);margin-top:12px;max-width:40ch}
.demo-ui{display:flex;flex-direction:column;gap:12px}
.demo-ui label{font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.demo-ui input,.demo-ui select{font:400 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 12px;width:100%;min-width:0}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,9rem);gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button,.mini{font:500 .85rem var(--f-body);background:none;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.mini{border-radius:6px;padding:6px 12px}
.demo-ui .btn{cursor:pointer;align-self:flex-start;font-size:.95rem;padding:11px 20px}
.demo-ui .btn.ghost{background:none;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.note-mono{font:500 .72rem var(--f-mono);letter-spacing:.05em;color:var(--muted)}
.neg{color:var(--signal)}

/* steps */
.how{padding-block:56px;border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:40px;list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:18px}
.steps li::before{content:counter(s);font:500 .85rem var(--f-mono);color:var(--accent);display:block;margin-bottom:8px}
.steps p{color:var(--muted);margin-top:8px}

/* who + faq */
.faq{padding-block:56px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px}
details{border-bottom:1px solid var(--line);padding-block:18px}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font:600 1.1rem var(--f-body);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";font-family:var(--f-mono);color:var(--accent)}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:10px;max-width:60ch}

/* closing */
.close{background:var(--ink);color:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-block:80px;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.close .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:48px;align-items:end}
.close p{color:color-mix(in srgb,var(--bg) 70%,transparent);margin-top:16px;max-width:46ch}
.close .btn{border-color:var(--bg);color:var(--bg)}
footer{padding-block:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  .hero,.app,.faq,.close .wrap{grid-template-columns:minmax(0,1fr);gap:36px}
  .app:nth-of-type(even) .copy{order:0}
  .steps{grid-template-columns:minmax(0,1fr);gap:28px}
  .demo{grid-template-columns:minmax(0,1fr);gap:24px}
  .fields{grid-template-columns:minmax(0,1fr)}
  .hero{padding-block:24px 48px}
  body{font-size:15px}
}
@media (prefers-reduced-motion:no-preference){
  .bar i{transition:width .6s ease}
}

/* --- 7 Mamá Apps grid - merged from FINAL 7 --- */
.apps7{padding-block:56px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid7{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:32px}
.card7{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px;display:flex;gap:12px;align-items:center;transition:all .15s;cursor:pointer}
.card7:hover{transform:translateY(-2px)}
.icon7{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:white;font-size:18px;flex-shrink:0;font-family:var(--f-display)}
.icon7.admin{background:#111}
.icon7.mama{background:#1E6BFF}
.icon7.rosita{background:#FF8A1E}
.icon7.pagos{background:#1DB954}
.icon7.historial{background:#14B8A6}
.icon7.inventario{background:#EF4444}
.icon7.medico{background:#8B5CF6}
.card7 b{display:block;font-size:.95rem;letter-spacing:-.01em;font-weight:600}
.card7 span{font-size:.78rem;color:var(--muted);display:block;margin-top:2px;line-height:1.3}
@media(max-width:900px){.grid7{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid7{grid-template-columns:1fr}}


.card7.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.demo-display .demo{margin-top:0}


/* ===== iPHONE OPTIMIZATION ===== */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
input,select,textarea{font-size:16px !important} /* Evita zoom en Safari iPhone */
button,.btn,.card7,.chips button{min-height:44px;min-width:44px} /* Apple touch target */
.card7{padding:14px}
.tabs button{min-height:44px}
.demo-ui input,.demo-ui select{padding:14px 12px;border-radius:10px}
.btn{padding:14px 22px;border-radius:10px}
a{ -webkit-touch-callout:default }
/* Notch / Safe area */
body{padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right));padding-bottom:env(safe-area-inset-bottom)}
.close{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
/* Grid 7 icons: 2 columnas en iPhone, 1 en muy pequeño */
@media(max-width:820px){
  .grid7{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .hero{gap:28px;padding-block:28px 40px}
  .apps{padding-block:16px 24px}
  .app{grid-template-columns:1fr;gap:24px;padding-block:36px}
  .demo{grid-template-columns:1fr;gap:20px}
  .fields{grid-template-columns:1fr}
  .close .wrap{grid-template-columns:1fr;gap:28px}
  #pricing > div > div[style*="grid-template-columns:repeat(3"]{grid-template-columns:1fr !important}
  .steps{grid-template-columns:1fr}
  .faq{grid-template-columns:1fr;gap:32px}
  h1{font-size:2.1rem !important;line-height:1.1}
  h2{font-size:1.55rem !important}
  .clocks{gap:18px;margin-top:28px}
}
@media(max-width:380px){
  .grid7{grid-template-columns:1fr}
  .card7{padding:12px}
  body{font-size:15px}
}
/* Scroll suave y momentum en iOS */
.demo-display{scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
input,button{appearance:none;-webkit-appearance:none}
/* Evita que Safari haga zoom en inputs de demos */
#n1,#d4i,#a4i{font-size:16px}
/* Botones de llamada grandes en iPhone */
a[href^="tel:"]{display:inline-flex;align-items:center;gap:8px;min-height:44px}

</style>



</head>
