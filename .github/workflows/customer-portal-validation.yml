name: Customer portal validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [customer-portal-auth]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate portal and billing security invariants
        run: node scripts/validate-customer-portal.mjs
