<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset password — Cuidar a Distancia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#17342e;--muted:#667b74;--line:#dfe9e3;--green:#0f766e;--green-soft:#e8f4ef;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 8%,#eaf5ef 0,#f6f8f5 40%,#f3f6f2 100%);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.shell{width:min(100%,440px)}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 18px;text-decoration:none;color:var(--ink)}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,#2dd4bf,#0f766e);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800;box-shadow:0 5px 14px #0f766e33}
.brand strong{font-size:15px;letter-spacing:-.02em}
.brand span{display:block;font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 50px #17342e12}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
h1{font-size:25px;line-height:1.15;letter-spacing:-.03em;margin:0 0 7px}
.lede{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 20px}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}
input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:#fbfcfb;color:var(--ink);font:inherit;font-size:14px;outline:none}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px #0f766e18;background:#fff}
.btn{width:100%;height:43px;border:0;border-radius:9px;background:var(--green);color:#fff;font:700 13px "Manrope",sans-serif;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.secondary{background:#fff;color:var(--green);border:1px solid #cfe4db;margin-top:9px}
.message{display:none;border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.5;margin:14px 0 0;background:var(--green-soft);color:#0b5d55}
.message.show{display:block}
.message.error{background:#fff1f0;color:var(--danger)}
.foot{text-align:center;color:var(--muted);font-size:11px;line-height:1.7;margin-top:18px}
.foot a{color:var(--green);font-weight:700;text-decoration:none}
.lang{display:flex;justify-content:center;gap:2px;margin:0 0 12px}
.lang button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:4px 8px;font:700 10px "Manrope",sans-serif;cursor:pointer}
.lang button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
[hidden]{display:none!important}
@media(max-width:480px){.card{padding:22px}h1{font-size:22px}body{padding:16px}}
</style>
</head>
<body>
<main class="shell">
  <a class="brand" href="https://marbaquero.github.io/">
    <span class="brand-mark" aria-hidden="true">C</span>
    <span><strong>Cuidar a Distancia</strong><span>Family account</span></span>
  </a>
  <div class="lang" aria-label="Language"><button type="button" data-lang="es">ES</button><button type="button" class="active" data-lang="en">EN</button></div>
  <section class="card">
    <div class="eyebrow" id="eyebrow">Account recovery</div>
    <h1 id="title">Reset your password</h1>
    <p class="lede" id="lede">Enter the email for your family account and we’ll send a secure reset link.</p>

    <form id="requestForm">
      <label for="email" id="emailLabel">Email address</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@email.com">
      <button class="btn" id="sendBtn" type="submit">Send reset link</button>
      <p class="message" id="message" role="status"></p>
    </form>

    <form id="updateForm" hidden>
      <label for="newPassword" id="newLabel">New password</label>
      <input id="newPassword" type="password" minlength="10" autocomplete="new-password" required placeholder="At least 10 characters">
      <label for="confirmPassword" id="confirmLabel">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required placeholder="Repeat the new password">
      <button class="btn" id="updateBtn" type="submit">Update password</button>
      <p class="message" id="updateMessage" role="status"></p>
    </form>

    <button class="btn secondary" id="backToLogin" type="button">Back to sign in</button>
    <p class="foot">Need help? <a href="mailto:marbaquero@yahoo.com">Email support</a>.</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fftnffmttuzfftntzzhu.supabase.co";
const SUPABASE_KEY="sb_publishable_f5py08cOv3Bdo0Yvm6lmbA_VBxnbEsP";
const portal="https://marbaquero.github.io/portal.html";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let locale="en";
const words={
 en:{eyebrow:"Account recovery",title:"Reset your password",lede:"Enter the email for your family account and we’ll send a secure reset link.",emailLabel:"Email address",send:"Send reset link",sent:"If that email has an account, a reset link is on its way. Check your inbox and spam folder.",back:"Back to sign in",newLabel:"New password",confirmLabel:"Confirm new password",update:"Update password",updated:"Your password has been updated. You can now sign in.",mismatch:"The passwords do not match.",short:"Use at least 10 characters.",error:"We could not complete that request. Please try again.",requestTitle:"Choose a new password",requestLede:"Enter a new password for your family account."},
 es:{eyebrow:"Recuperación de cuenta",title:"Restablezca su contraseña",lede:"Ingrese el correo de su cuenta familiar y le enviaremos un enlace seguro.",emailLabel:"Correo electrónico",send:"Enviar enlace",sent:"Si ese correo tiene una cuenta, el enlace va en camino. Revise su bandeja y spam.",back:"Volver a iniciar sesión",newLabel:"Nueva contraseña",confirmLabel:"Confirmar nueva contraseña",update:"Actualizar contraseña",updated:"Su contraseña fue actualizada. Ya puede iniciar sesión.",mismatch:"Las contraseñas no coinciden.",short:"Use al menos 10 caracteres.",error:"No pudimos completar la solicitud. Intente de nuevo.",requestTitle:"Elija una nueva contraseña",requestLede:"Ingrese una nueva contraseña para su cuenta familiar."}
};
function t(k){return words[locale][k]}
function apply(){
 document.documentElement.lang=locale;
 $("eyebrow").textContent=t("eyebrow"); $("title").textContent=t("title"); $("lede").textContent=t("lede");
 $("emailLabel").textContent=t("emailLabel"); $("sendBtn").textContent=t("send");
 $("newLabel").textContent=t("newLabel"); $("confirmLabel").textContent=t("confirmLabel"); $("updateBtn").textContent=t("update");
 $("backToLogin").textContent=t("back");
 document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===locale));
}
function message(el,text,error=false){el.textContent=text;el.className="message show"+(error?" error":"")}
function showUpdate(){
 $("requestForm").hidden=true; $("updateForm").hidden=false;
 $("eyebrow").textContent=t("eyebrow"); $("title").textContent=t("requestTitle"); $("lede").textContent=t("requestLede");
}
function showRequest(){ $("requestForm").hidden=false; $("updateForm").hidden=true; }
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{locale=b.dataset.lang;apply()}));
$("backToLogin").addEventListener("click",()=>location.assign(portal));
$("requestForm").addEventListener("submit",async e=>{
 e.preventDefault(); const btn=$("sendBtn"); btn.disabled=true; $("message").className="message";
 const email=$("email").value.trim();
 try{
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/reset.html"});
  if(error) throw error;
  message($("message"),t("sent"));
 }catch(err){console.error(err);message($("message"),t("error"),true)}finally{btn.disabled=false}
});
$("updateForm").addEventListener("submit",async e=>{
 e.preventDefault(); const btn=$("updateBtn"); const p=$("newPassword").value; const c=$("confirmPassword").value;
 if(p.length<10){message($("updateMessage"),t("short"),true);return}
 if(p!==c){message($("updateMessage"),t("mismatch"),true);return}
 btn.disabled=true;
 try{
  const {error}=await sb.auth.updateUser({password:p});
  if(error) throw error;
  message($("updateMessage"),t("updated"));
  setTimeout(()=>location.assign(portal),1200);
 }catch(err){console.error(err);message($("updateMessage"),t("error"),true)}finally{btn.disabled=false}
});
(async()=>{
 apply();
 const hash=new URLSearchParams(location.hash.replace(/^#/,""));
 if(hash.get("type")==="recovery" || new URLSearchParams(location.search).get("reset")==="1"){
  const {data:{session}}=await sb.auth.getSession();
  if(session){showUpdate(); if(location.hash) history.replaceState(null,"",location.pathname+location.search);}
 }
 sb.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")showUpdate()});
})();
</script>
</body>
</html>
